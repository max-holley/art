<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft Pro</title>
    <link rel="icon" href="./logo.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="mobile-blocker">
        <div class="message-box">
            <h1>🖥️ Desktop Required</h1>
            <p>PixelCraft Pro requires a larger screen and precise pointer input. Please use a Laptop or Desktop computer.</p>
        </div>
    </div>

    <div class="app-container">
        <aside class="toolbar">
            <h2>PixelCraft Pro</h2>
            
            <div class="control-group">
                <label>Grid Size</label>
                <input type="number" id="grid-size" value="8">
            </div>

            <div class="control-group">
                <label>Grid Opacity</label>
                <input type="range" id="grid-opacity" min="0" max="1" step="0.05" value="0.7">
            </div>

            <div class="button-group">
                <button id="btn-undo">Undo</button>
                <button id="btn-redo">Redo</button>
            </div>

            <div class="control-group">
                <label>Background</label>
                <input type="color" id="bg-color-picker" value="#a1a1a1">
            </div>

            <div class="control-group">
                <label>Pen Color</label>
                <input type="color" id="color-picker" value="#00ffcc">
            </div>

            <div class="button-group">
                <button id="btn-draw" class="active">Pen</button>
                <button id="btn-fill">Bucket</button>
                <button id="btn-erase">Eraser</button>
                <button id="btn-clear">Clear</button>
            </div>

            <hr>

            <div class="control-group">
                <label>Project File (.json)</label>
                <div class="button-group">
                    <button id="btn-save-project">Save</button>
                    <button id="btn-load-project">Load</button>
                </div>
                <input type="file" id="file-input" accept=".json" style="display:none">
            </div>

            <div class="control-group">
                <label>Export Image</label>
                <select id="export-format">
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                    <option value="image/jpeg">JPEG</option>
                </select>
                <label class="checkbox-label" id="transparency-label">
                    <input type="checkbox" id="check-transparent"> Transparent
                </label>
                <button id="btn-download" class="primary">Download Image</button>
            </div>
            
            <button id="btn-reset-view">Reset Zoom</button>
        </aside>

        <main class="canvas-area">
            <div id="viewport">
                <div id="canvas-container">
                    <canvas id="pixel-canvas" width="600" height="600"></canvas>
                    <canvas id="grid-canvas" width="600" height="600"></canvas>
                </div>
            </div>
            <div class="instructions">Space+Drag: Pan | Scroll: Zoom</div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
