<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./logo.jpeg">
</head>
<body>

    <div class="app-container">
        <aside class="toolbar">
            <h2>PixelCraft</h2>
            
            <div class="control-group">
                <label>Grid Size (8-64)</label>
                <input type="number" id="grid-size" value="32" min="8" max="64">
            </div>

            <div class="control-group">
                <label>Background Color</label>
                <input type="color" id="bg-color-picker" value="#ffffff">
            </div>

            <div class="control-group">
                <label>Pen Color</label>
                <input type="color" id="color-picker" value="#00ffcc">
            </div>

            <div class="button-group">
                <button id="btn-draw" class="active">Pen</button>
                <button id="btn-erase">Eraser</button>
                <button id="btn-clear">Clear All</button>
            </div>

            <hr>

            <div class="control-group">
                <label>Export Format</label>
                <select id="export-format">
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                    <option value="image/jpeg">JPEG</option>
                </select>
            </div>

            <div class="control-group" id="transparency-container">
                <label class="checkbox-label">
                    <input type="checkbox" id="check-transparent"> Transparent Export
                </label>
            </div>

            <button id="btn-download" class="primary">Download Masterpiece</button>
        </aside>

        <main class="canvas-area">
            <div id="canvas-container">
                <canvas id="pixel-canvas"></canvas>
                <canvas id="grid-canvas"></canvas>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
